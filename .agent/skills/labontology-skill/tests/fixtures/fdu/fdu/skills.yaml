    working_dir: "fdu-device-run"
    command: ["python", "scripts/run_protocol.py"]
    inputs: ["artifact:device-protocol-json"]
    outputs:
      "artifact:device-execution-record": "execution_record.json"
    required_capabilities: ["capability:fdu-device-submit"]
    side_effect_level: "device_task_create"
    timeout_seconds: 600

  - id: "skill:fdu-execution-monitoring"
