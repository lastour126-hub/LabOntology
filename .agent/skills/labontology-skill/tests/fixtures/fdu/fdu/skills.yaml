skills:
  - id: "skill:chemical-amount-calculator"
    name: "chemical-amount-calculator"
    entrypoint: "chemical-amount-calculator/SKILL.md"
    entrypoints:
      - "chemical-amount-calculator/scripts/calculate_amounts.py"
    working_dir: "chemical-amount-calculator"
    command: ["python", "scripts/calculate_amounts.py"]
    inputs: ["artifact:constraint-json", "artifact:recommendation-table"]
    outputs:
      "artifact:chemical-amounts-csv": "chemical_amounts.csv"
    side_effect_level: "local_file_write"
    timeout_seconds: 600

  - id: "skill:constraint-parser"
    name: "constraint-parser"
    entrypoint: "constraint-parser/SKILL.md"
    entrypoints:
      - "constraint-parser/scripts/parse_constraints.py"
    working_dir: "constraint-parser"
    command: ["python", "scripts/parse_constraints.py"]
    outputs:
      "artifact:constraint-json": "constraints.json"
      "artifact:candidate-space-csv": "candidate_space.csv"
    side_effect_level: "local_file_write"
    timeout_seconds: 300

  - id: "skill:experiment-step-generator"
    name: "experiment-step-generator"
    entrypoint: "experiment-step-generator/SKILL.md"
    entrypoints:
      - "experiment-step-generator/scripts/generate_steps.py"
    working_dir: "experiment-step-generator"
    command: ["python", "scripts/generate_steps.py"]
    inputs: ["artifact:constraint-json"]
    outputs:
      "artifact:experiment-steps-md": "experiment_steps.md"
