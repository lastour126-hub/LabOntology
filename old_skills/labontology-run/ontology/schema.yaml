version: "0.5"
identifier_pattern: "^[A-Za-z][A-Za-z0-9_.:-]*$"
classes_file: classes.yaml
relations_file: relations.yaml
required_entity_fields: [id, type, properties]
required_relation_fields: [source, relation, target]
validation:
  reject_unknown_classes: true
  reject_unknown_relations: true
  require_relation_endpoints: true
  validate_relation_domain_range: true
  reject_duplicate_ids: true
  require_flow_steps_to_be_orderable: false
