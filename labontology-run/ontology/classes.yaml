classes:
  Mission:
    description: One concrete user-requested goal being executed by the Agent.
  SkillFlow:
    description: Optional reference path that may help an Agent inspect dependencies or likely next Skills.
  FlowNode:
    description: One referenced Skill position in an optional SkillFlow; it is not an executable mission step.
  Skill:
    description: Callable capability exposed by an FduSkill package.
  SkillSuite:
    description: Registered collection of skills, flows, and contracts for one device or laboratory platform.
  ExecutionEnvironment:
    description: Registered device, platform, or execution environment associated with a skill suite.
  Capability:
    description: Device or platform capability required by or supported by a skill.
  SkillContract:
    description: Input, output, parameter, and side-effect contract for a skill.
  Artifact:
    description: Structured file or object passed between flow nodes.
  ArtifactType:
    description: Semantic type and data contract category for an artifact.
  Precondition:
    description: Evidence or capability condition relevant when an Agent considers a Skill.
  ExecutionPolicy:
    description: Safety or execution rule constraining a Skill or optional reference path.
  SkillExecution:
    description: Runtime record of one invocation of a skill.
